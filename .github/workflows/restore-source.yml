name: Restore project source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-source.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore archived project
        shell: bash
        run: |
          cat .upload/source.part* | base64 --decode > source.zip
          unzip -o source.zip
          rm -rf .upload source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore LH Review Copilot project source"
          git push
